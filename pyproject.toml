[build-system]
requires = ["pyoz>=0.13.10"]
build-backend = "pyoz.backend"

[project]
# The import name is `zrun` (module-name below); every zsuite package is
# published as <name>-py
name = "zrun-py"
version = "0.4.0"
description = "Execution for languages built with zgram and zrules: semantics written as Python functions, compiled to native code."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniele Linguaglossa" }]
dependencies = ["zgram-py>=0.5.0", "zrules-py>=0.2.0"]
# zrun.build_executable(): Zig, to link an executable's launcher
optional-dependencies = { exe = ["ziglang>=0.16"] }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[tool.pyoz]
# Path to your Zig source file
module-path = "src/lib.zig"

# Python import name (the distribution is zrun-py)
module-name = "zrun"

# Strip debug symbols in release builds
strip = true

# One wheel per platform for CPython 3.10+ (stable ABI)
abi3 = true

# The suite's lint (CI's lint job): pyflakes, pycodestyle, pyupgrade for 3.10+
[tool.ruff]
target-version = "py310"
extend-exclude = ["zig-pkg", "zig-out", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# (its semantics are what the front reads: their unused names and `l`s are
# the code under test)
"test/test_front.py" = ["E741", "F841", "F842"]
